version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (dengan pgvector)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: bmkg_postgres
    environment:
      POSTGRES_DB: bmkg_softpro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bmkg_network

  # ============================================================================
  # Laravel + PHP Application
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmkg_app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bmkg_softpro}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      
      # RAG Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-bmkg_softpro}
      GOOGLE_AI_KEY: ${GOOGLE_AI_KEY}
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 100
      SIMILARITY_THRESHOLD: 0.5
      TOP_K_RESULTS: 5
      FLASK_PORT: 5000
      FLASK_ENV: production
      CHATBOT_SERVER_PORT: 3001
      RAG_SERVICE_URL: http://localhost:5000
      USE_RAG: "true"
    
    depends_on:
      postgres:
        condition: service_healthy
    
    ports:
      - "8000:8000"   # Laravel
      - "3001:3001"   # Chatbot
      - "5000:5000"   # RAG Service
    
    volumes:
      - .:/var/www/html
      - ./storage/logs:/var/log
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - bmkg_network
    
    # Override entrypoint to start all services
    entrypoint: /bin/sh -c "
      echo '🚀 Starting BMKG Application Stack...';
      
      echo '📊 Setting up database...';
      php artisan migrate --force;
      
      echo '🔧 Installing Python dependencies...';
      cd /var/www/html/python;
      pip install -q -r requirements.txt;
      
      echo '📥 Initializing RAG system...';
      python initialize_rag.py;
      
      echo '🤖 Starting services...';
      cd /var/www/html;
      supervisord -c /etc/supervisord.conf;
    "

volumes:
  postgres_data:
    driver: local

networks:
  bmkg_network:
    driver: bridge
