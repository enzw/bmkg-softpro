[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
childlogdir=/var/log
umask=0022

; Laravel Web Server
[program:laravel]
process_name=%(program_name)s
command=php artisan serve --host=0.0.0.0 --port=%(ENV_PORT)s
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/laravel.log
stderr_logfile=/var/log/laravel.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=www-data
numprocs=1

; Node.js Chatbot Server
[program:chatbot]
process_name=%(program_name)s
command=node chatbot-server.js
directory=/var/www/html
environment=CHATBOT_SERVER_PORT=3001,NODE_ENV=production
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/chatbot.log
stderr_logfile=/var/log/chatbot.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=root

[group:app]
programs=laravel,chatbot
priority=999
