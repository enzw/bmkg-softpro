[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
childlogdir=/var/log
umask=0022

; Laravel Web Server
[program:laravel]
process_name=%(program_name)s
command=/bin/bash -c "exec php -S 0.0.0.0:${PORT:-8080} /var/www/html/server.php 2>&1"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/laravel.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
user=root
numprocs=1

; Node.js Chatbot Server
[program:chatbot]
process_name=%(program_name)s
command=/bin/bash /var/www/html/chatbot-startup.sh
directory=/var/www/html
environment=CHATBOT_SERVER_PORT=3001,NODE_ENV=production
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/chatbot.log
stderr_logfile=/var/log/chatbot.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=root

; Python RAG Service
[program:rag]
process_name=%(program_name)s
command=python3 -u /var/www/html/python/app.py
directory=/var/www/html/python
environment=PYTHONUNBUFFERED=1,FLASK_APP=app.py,FLASK_ENV=production
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/rag.log
stderr_logfile=/var/log/rag.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=root

[group:app]
programs=laravel,chatbot,rag
priority=999
