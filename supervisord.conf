[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; Laravel Web Server
[program:laravel]
process_name=%(program_name)s
command=php -S 0.0.0.0:8080 -t public
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
stdout_logfile=/var/log/laravel.log
stderr_logfile=/var/log/laravel.log
user=www-data
numprocs=1

; Node.js Chatbot Server
[program:chatbot]
process_name=%(program_name)s
command=node chatbot-server.js
directory=/var/www/html
environment=CHATBOT_SERVER_PORT=3001
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
stdout_logfile=/var/log/chatbot.log
stderr_logfile=/var/log/chatbot.log
user=root

[group:app]
programs=laravel,chatbot
priority=999
